<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="240" height="240">
  <defs>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
  </defs>
  <!-- Glow effect -->
  <circle cx="256" cy="256" r="180" fill="url(#laptopGrad)" opacity="0.15" filter="blur(30px)" />
  <!-- Laptop Screen Lid -->
  <rect x="76" y="80" width="360" height="240" rx="14" fill="url(#bodyGrad)" stroke="#475569" stroke-width="3" />
  <!-- Display Bezel & Screen -->
  <rect x="96" y="100" width="320" height="200" rx="6" fill="url(#screenGrad)" />
  <!-- Screen Graphic -->
  <path d="M120 260 L200 180 L260 220 L340 140 L380 180" fill="none" stroke="url(#laptopGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="340" cy="140" r="7" fill="#F5C842" />
  <circle cx="256" cy="90" r="3" fill="#64748B" />
  <!-- Laptop Base -->
  <path d="M40 330 L472 330 L442 380 L70 380 Z" fill="#1E293B" stroke="#475569" stroke-width="3" />
  <rect x="220" y="330" width="72" height="8" rx="4" fill="#64748B" />
  <!-- Trackpad -->
  <rect x="206" y="345" width="100" height="25" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
</svg>
