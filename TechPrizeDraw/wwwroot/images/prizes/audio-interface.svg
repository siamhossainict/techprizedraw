<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="240" height="240">
  <defs>
    <linearGradient id="metalChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="50%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="knobGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C842" />
      <stop offset="100%" stop-color="#C68E28" />
    </linearGradient>
  </defs>
  <!-- Glow -->
  <circle cx="256" cy="256" r="180" fill="#F5C842" opacity="0.1" filter="blur(30px)" />
  <!-- Main Chassis -->
  <rect x="66" y="146" width="380" height="220" rx="18" fill="url(#metalChassis)" stroke="#7C2D12" stroke-width="4" />
  <!-- Front Panel Face -->
  <rect x="80" y="160" width="352" height="192" rx="10" fill="#18181B" stroke="#27272A" stroke-width="2" />
  <!-- XLR Inputs -->
  <circle cx="140" cy="240" r="32" fill="#09090B" stroke="#3F3F46" stroke-width="3" />
  <circle cx="140" cy="240" r="12" fill="#27272A" />
  <circle cx="130" cy="235" r="4" fill="#71717A" />
  <circle cx="150" cy="235" r="4" fill="#71717A" />
  <circle cx="140" cy="250" r="4" fill="#71717A" />
  <circle cx="230" cy="240" r="32" fill="#09090B" stroke="#3F3F46" stroke-width="3" />
  <circle cx="230" cy="240" r="12" fill="#27272A" />
  <!-- Big Monitor Volume Knob -->
  <circle cx="360" cy="240" r="44" fill="url(#knobGold)" stroke="#78350F" stroke-width="3" />
  <circle cx="360" cy="240" r="36" fill="#27272A" />
  <line x1="360" y1="204" x2="360" y2="225" stroke="#F5C842" stroke-width="4" stroke-linecap="round" />
  <!-- LED Ring meters -->
  <circle cx="140" cy="240" r="38" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="10 5" />
  <circle cx="230" cy="240" r="38" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="10 5" />
  <!-- Status Lights -->
  <circle cx="100" cy="180" r="4" fill="#10B981" />
  <circle cx="115" cy="180" r="4" fill="#00D2FF" />
  <text x="320" y="325" fill="#A1A1AA" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="2">MONITOR</text>
</svg>
